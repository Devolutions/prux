name: oidc-login-test
on:
  push:
    branches:
      - devops/DEVOPS-4869-docker-hub-oidc
permissions:
  contents: read
jobs:
  login:
    environment: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v4
        env:
          DOCKERHUB_OIDC_CONNECTIONID: bc91ef0a-e24f-4b43-bfa2-d1a7b06732e6
        with:
          username: devolutions
